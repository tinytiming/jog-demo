; UM FeatherS2 Neo (ESP32-S2, built-in 5x5 RGB matrix) + AW9110C "Jog Breakout" demo
; Wire the Jog Breakout's I2C (3V3 / GND / SDA / SCL) to the Feather's I2C pins.

[env:um_feathers2_neo]
platform = espressif32
board = um_feathers2_neo
framework = arduino

monitor_speed = 115200

lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.0

build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1   ; FeatherS2 Neo is native-USB only: route Serial to USB CDC
	-D JOG_DEBUG_SERIAL=1          ; print the driver's raw P0DI / event diagnostics
